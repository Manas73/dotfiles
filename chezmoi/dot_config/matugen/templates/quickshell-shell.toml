# Generated by matugen for the Quickshell desktop shell.

[bar]
background       = '{{colors.background.default.hex}}'
background-alpha = 1.0
text             = '{{colors.on_surface.default.hex}}'
active           = '{{colors.error.default.hex}}'
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28
margin           = 10
padding          = 12

[hyprland]
active-border            = '{{colors.primary.default.hex}}'
active-border-foreground = '{{colors.on_surface.default.hex}}'

[controls]
normal-color        = '{{colors.on_surface.default.hex}}'
normal-fill-alpha   = 0.04
normal-border       = '{{colors.on_surface.default.hex}}'
normal-border-width = 1
normal-border-alpha = 0.4
hover-cursor-color        = '{{colors.on_surface.default.hex}}'
hover-cursor-fill-alpha   = 0.08
hover-cursor-border       = '{{colors.on_surface.default.hex}}'
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.25
focus-color        = '{{colors.on_surface.default.hex}}'
focus-fill-alpha   = 0.08
focus-border       = '{{colors.on_surface.default.hex}}'
focus-border-width = 1
focus-border-alpha = 0.25
selected-color        = '{{colors.on_surface.default.hex}}'
selected-fill-alpha   = 0.18
selected-border       = '{{colors.on_surface.default.hex}}'
selected-border-width = 0
selected-border-alpha = 1.0
pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background       = '{{colors.background.default.hex}}'
background-alpha = 1.0
text             = '{{colors.on_surface.default.hex}}'
border           = 'hyprland.active-border'
border-alpha     = 1.0

[tooltip]
background       = '{{colors.background.default.hex}}'
background-alpha = 0.97
text             = '{{colors.on_surface.default.hex}}'
border           = 'hyprland.active-border-foreground'
border-alpha     = 1.0

[notifications]
background       = '{{colors.background.default.hex}}'
background-alpha = 1.0
text             = '{{colors.on_surface.default.hex}}'
border           = 'hyprland.active-border'
border-alpha     = 1.0
countdown        = '{{colors.primary.default.hex}}'

[launcher]
background                = '{{colors.background.default.hex}}'
background-alpha          = 0.95
text                      = '{{colors.on_surface.default.hex}}'
border                    = 'hyprland.active-border-foreground'
border-alpha              = 1.0
scrim                     = '{{colors.background.default.hex}}'
scrim-alpha               = 0.5
selected-background       = '{{colors.on_surface.default.hex}}'
selected-background-alpha = 0.08
selected-text             = '{{colors.primary.default.hex}}'
selected-border           = 'hyprland.active-border-foreground'
selected-border-alpha     = 0.25

[menu]
background                = '{{colors.background.default.hex}}'
background-alpha          = 1.0
text                      = '{{colors.on_surface.default.hex}}'
border                    = 'hyprland.active-border-foreground'
border-alpha              = 1.0
scrim                     = '{{colors.background.default.hex}}'
scrim-alpha               = 0.5
selected-background       = '{{colors.on_surface.default.hex}}'
selected-background-alpha = 0.08
selected-text             = '{{colors.primary.default.hex}}'
selected-border           = 'hyprland.active-border-foreground'
selected-border-alpha     = 0.25

[polkit]
background       = '{{colors.background.default.hex}}'
background-alpha = 1.0
text             = '{{colors.on_surface.default.hex}}'
text-error       = '{{colors.error.default.hex}}'
border           = 'hyprland.active-border'
border-error     = '{{colors.error.default.hex}}'
border-alpha     = 1.0
scrim            = '{{colors.background.default.hex}}'
scrim-alpha      = 0.5
accent           = '{{colors.primary.default.hex}}'

[lock]
background       = '{{colors.background.default.hex}}'
background-alpha = 0.8
text             = '{{colors.on_surface.default.hex}}'
text-error       = '{{colors.error.default.hex}}'
border           = 'hyprland.active-border'
border-active    = 'hyprland.active-border'
border-error     = '{{colors.error.default.hex}}'
border-alpha     = 1.0
selection        = '{{colors.primary.default.hex}}'
selection-alpha  = 0.45

[image-picker]
scrim                   = '{{colors.background.default.hex}}'
scrim-alpha             = 0.5
text                    = '{{colors.on_surface.default.hex}}'
selected-border         = '{{colors.primary.default.hex}}'
selected-border-alpha   = 1.0
unselected-border       = '{{colors.on_surface.default.hex}}'
unselected-border-alpha = 0.28
