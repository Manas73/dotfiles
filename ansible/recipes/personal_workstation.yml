---
# Recipe: personal Linux workstation.
#
# Applied when a host sets recipe: personal_workstation (hosts.yml).
# OS packages come from group_vars/<os>/apps.yml; this file is the shared
# "what kind of machine" recipe (profiles, flags, chezmoi data).

# Chezmoi data (unprefixed; chezmoi.toml.j2 reads these directly).
# profile=personal keeps personal SSH keys managed (.chezmoiignore).
profile: "personal"
email: "manas.sambare@gmail.com"

# Plasma custom window manager. Consumed by the plasma_custom_wm role.
# "kwin" (or empty) unmasks stock KWin. Must stay defined so the role
# actually runs and restores KWin after a previous custom-WM setup.
plasma_window_manager: "kwin"

# Profile membership. Each name resolves against profiles_catalog
# (group_vars/all/profiles.yml).
profiles:
  - cli
  - cloud
  - development
  - fonts
  - gaming
  - hyprland
  - kde
  - virtualization

# Feature flags (override group_vars/all defaults).
docker_enabled: true
kanata_enabled: true
libvirt_enabled: true
