---
# Ensure Fish is the login shell for the primary user.
# Fish itself is installed by roles/packages. ~/.config/fish stays with Chezmoi.

- name: Locate the fish binary
  ansible.builtin.shell: command -v fish
  register: fish_binary
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [system, fish]

- name: Fail fast if fish is not installed
  ansible.builtin.fail:
    msg: >-
      fish is not installed on this host. Install it via the packages role
      (intent `fish` in os_apps) before running the system role.
  when: fish_binary.rc != 0
  tags: [system, fish]

- name: Ensure fish is a registered login shell
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: "{{ fish_binary.stdout }}"
    state: present
    create: false
  become: true
  tags: [system, fish]

- name: Set fish as the primary user's login shell
  ansible.builtin.user:
    name: "{{ primary_user }}"
    shell: "{{ fish_binary.stdout }}"
  become: true
  register: fish_shell_change
  tags: [system, fish]

- name: Report when the shell has just been switched
  ansible.builtin.debug:
    msg: >-
      Login shell changed to {{ fish_binary.stdout }} for {{ primary_user }}.
      Log out and back in for the change to take effect.
  when: fish_shell_change is changed
  tags: [system, fish]
