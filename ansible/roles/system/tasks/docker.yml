---
# Configure Docker for the primary user on Linux: docker group + docker.socket.
# Gated by docker_enabled. Docker packages are installed by roles/packages.

- name: Verify docker binary is present
  ansible.builtin.shell: command -v docker
  register: docker_binary
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [system, docker]

- name: Fail fast if docker is not installed
  ansible.builtin.fail:
    msg: >-
      docker is not installed. On Arch it is installed by the packages role
      (intent `docker` in arch_apps). Run packages before the system role.
  when: docker_binary.rc != 0
  tags: [system, docker]

- name: Ensure the docker group exists
  ansible.builtin.group:
    name: docker
    state: present
  become: true
  tags: [system, docker]

- name: Ensure the primary user is in the docker group
  ansible.builtin.user:
    name: "{{ primary_user }}"
    groups: docker
    append: true
  become: true
  register: docker_group_change
  tags: [system, docker]

- name: Enable docker.socket (starts Docker on demand)
  ansible.builtin.systemd_service:
    name: docker.socket
    enabled: true
  become: true
  tags: [system, docker]

- name: Report when group membership was just granted
  ansible.builtin.debug:
    msg: >-
      {{ primary_user }} added to the docker group. Log out and back in
      for the group membership to take effect.
  when: docker_group_change is changed
  tags: [system, docker]
