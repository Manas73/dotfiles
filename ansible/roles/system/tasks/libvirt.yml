---
# Configure libvirt / qemu for the primary user on Linux: kvm + libvirt
# group membership. Gated by libvirt_enabled. Packages come from the
# virtualization profile via roles/packages; libvirtd/virtlogd socket
# enablement is owned by roles/services (service_catalog).

- name: Verify libvirtd binary is present
  ansible.builtin.shell: command -v libvirtd
  register: libvirtd_binary
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [system, libvirt]

- name: Fail fast if libvirt is not installed
  ansible.builtin.fail:
    msg: >-
      libvirtd is not installed. Add the `virtualization` profile to this
      host's profiles: list so the packages role installs the qemu/libvirt
      stack, then re-run.
  when: libvirtd_binary.rc != 0
  tags: [system, libvirt]

- name: Ensure the kvm group exists
  ansible.builtin.group:
    name: kvm
    state: present
  become: true
  tags: [system, libvirt]

- name: Ensure the libvirt group exists
  ansible.builtin.group:
    name: libvirt
    state: present
  become: true
  tags: [system, libvirt]

- name: Ensure the primary user is in the kvm and libvirt groups
  ansible.builtin.user:
    name: "{{ primary_user }}"
    groups:
      - kvm
      - libvirt
    append: true
  become: true
  register: libvirt_group_change
  tags: [system, libvirt]

- name: Report when group membership was just granted
  ansible.builtin.debug:
    msg: >-
      {{ primary_user }} added to kvm and libvirt groups. Log out and
      back in for the group membership to take effect (or use
      `newgrp libvirt` and `newgrp kvm` in your current shell).
  when: libvirt_group_change is changed
  tags: [system, libvirt]
