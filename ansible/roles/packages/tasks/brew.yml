---
# Install Homebrew formulae and casks on macOS hosts (one Brewfile).
#
# Input:
#   provider_packages (list[str]) — formulae
#   provider_casks    (list[str]) — casks
#   provider_taps     (list[str]) — user/repo taps for either
#
# Missing brew: official install.sh (NONINTERACTIVE). Interactive PATH
# is Chezmoi fish `brew shellenv`, not Ansible writing shell rc.

- name: Assert Homebrew package lists are lists
  ansible.builtin.assert:
    that:
      - provider_packages is defined
      - provider_packages is sequence
      - provider_casks is defined
      - provider_casks is sequence
    fail_msg: "packages/brew: provider_packages and provider_casks must be lists."
    quiet: true
  tags: [packages, brew, cask, darwin]

- name: Assert the host is Darwin
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Darwin'
    fail_msg: >-
      packages/brew requires a macOS host.
      Detected os_family={{ ansible_facts['os_family'] }}.
    quiet: true
  tags: [packages, brew, cask, darwin]

- name: Check if Homebrew is installed
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /opt/homebrew/bin/brew
    - /usr/local/bin/brew
  register: homebrew_check
  tags: [packages, brew, cask, darwin]

- name: Install Homebrew
  ansible.builtin.shell:
    cmd: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  environment:
    NONINTERACTIVE: "1"
  when:
    - homebrew_check.results | selectattr('stat.exists') | list | length == 0
    - not ansible_check_mode
  tags: [packages, brew, cask, darwin]

- name: Re-check Homebrew after install
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /opt/homebrew/bin/brew
    - /usr/local/bin/brew
  register: homebrew_check
  tags: [packages, brew, cask, darwin]

- name: Set Homebrew prefix
  ansible.builtin.set_fact:
    packages_brew_present: "{{ homebrew_check.results | selectattr('stat.exists') | list | length > 0 }}"
    homebrew_prefix: >-
      {{
        (
          homebrew_check.results
          | selectattr('stat.exists')
          | map(attribute='item')
          | map('dirname')
          | map('dirname')
          | list
          + [
            '/opt/homebrew'
            if ansible_facts['architecture'] in ['arm64', 'aarch64']
            else '/usr/local'
          ]
        ) | first
      }}
  tags: [packages, brew, cask, darwin]

- name: Ensure Homebrew is in PATH
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.zprofile"
    line: 'eval "$({{ homebrew_prefix }}/bin/brew shellenv)"'
    create: true
    mode: "0644"
  when: packages_brew_present | bool
  tags: [packages, brew, cask, darwin]

- name: Remember brew environment for later tasks
  ansible.builtin.set_fact:
    packages_brew_prefix: "{{ homebrew_prefix }}"
    packages_brew_stream_env:
      PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts['env']['PATH'] }}"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_EMOJI: "1"
      NONINTERACTIVE: "1"
      GIT_TERMINAL_PROMPT: "0"
  when: packages_brew_present | bool
  tags: [packages, brew, cask, darwin]

- name: Fail if Homebrew is still missing
  ansible.builtin.fail:
    msg: >-
      Homebrew is not installed at /opt/homebrew/bin/brew or
      /usr/local/bin/brew. install.sh needs `sudo -n`. Run it once
      in Terminal, then re-run.
  when:
    - not (packages_brew_present | bool)
    - not ansible_check_mode
    - (provider_packages | length > 0) or (provider_casks | length > 0)
  tags: [packages, brew, cask, darwin]

- name: Ensure Brewfile directory exists
  ansible.builtin.file:
    path: "{{ packages_brewfile | dirname }}"
    state: directory
    mode: "0700"
  when: packages_brew_present | bool
  tags: [packages, brew, cask, darwin]

- name: Write Brewfile
  ansible.builtin.copy:
    dest: "{{ packages_brewfile }}"
    mode: "0644"
    content: |
      {% for tap in provider_taps | default([]) | unique | sort %}
      tap {{ tap | to_json }}
      {% endfor %}
      {% for pkg in provider_packages | unique | sort %}
      brew {{ pkg | to_json }}
      {% endfor %}
      {% for pkg in provider_casks | unique | sort %}
      cask {{ pkg | to_json }}
      {% endfor %}
  when:
    - (provider_packages | length > 0) or (provider_casks | length > 0)
    - packages_brew_present | bool
  tags: [packages, brew, cask, darwin]

- name: Update Homebrew
  ansible.builtin.command:
    argv:
      - brew
      - update
  environment: "{{ packages_brew_stream_env }}"
  when:
    - not ansible_check_mode
    - packages_brew_update | bool
    - packages_brew_present | bool
  tags: [packages, brew, cask, darwin]

- name: Install Homebrew formulae and casks
  ansible.builtin.command:
    argv:
      - brew
      - bundle
      - install
      - --file
      - "{{ packages_brewfile }}"
      - --no-upgrade
      - --jobs
      - "{{ packages_brew_jobs }}"
  environment: "{{ packages_brew_stream_env }}"
  register: packages_brew_bundle
  changed_when: >-
    'Installing ' in (packages_brew_bundle.stdout | default(''))
    or '==> ' in (packages_brew_bundle.stdout | default(''))
  when:
    - not ansible_check_mode
    - (provider_packages | length > 0) or (provider_casks | length > 0)
    - packages_brew_present | bool
  tags: [packages, brew, cask, darwin]

- name: Clean up Homebrew cache
  ansible.builtin.command:
    argv:
      - brew
      - cleanup
      - --prune=7
  environment: "{{ packages_brew_stream_env }}"
  register: brew_cleanup
  changed_when: (brew_cleanup.stdout | default('')) | length > 0
  when:
    - not ansible_check_mode
    - packages_brew_present | bool
  tags: [packages, brew, cask, darwin]

- name: Scrub Homebrew cache, including downloads for installed formulae
  ansible.builtin.command:
    argv:
      - brew
      - cleanup
      - -s
  environment: "{{ packages_brew_stream_env }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - packages_brew_present | bool
  tags: [packages, brew, cask, darwin]
