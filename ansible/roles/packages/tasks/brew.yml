---
# Install Homebrew formulae and casks on macOS hosts.
#
# Input:
#   provider_packages (list[str]) — formulae
#   provider_casks    (list[str]) — casks
#   provider_taps     (list[str]) — user/repo taps for either
#
# Missing brew: official install.sh (NONINTERACTIVE).
# community.general.homebrew{,_tap,_cask} find brew in
# /opt/homebrew/bin and /usr/local/bin.

- name: Assert Homebrew package lists are lists
  ansible.builtin.assert:
    that:
      - provider_packages is defined
      - provider_packages is sequence
      - provider_casks is defined
      - provider_casks is sequence
    fail_msg: "packages/brew: provider_packages and provider_casks must be lists."
    quiet: true
  tags: [packages, brew, cask, darwin]

- name: Assert the host is Darwin
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Darwin'
    fail_msg: >-
      packages/brew requires a macOS host.
      Detected os_family={{ ansible_facts['os_family'] }}.
    quiet: true
  tags: [packages, brew, cask, darwin]

- name: Check if Homebrew is installed
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /opt/homebrew/bin/brew
    - /usr/local/bin/brew
  register: homebrew_check
  tags: [packages, brew, cask, darwin]

- name: Install Homebrew if missing
  when:
    - homebrew_check.results | selectattr('stat.exists') | list | length == 0
    - not ansible_check_mode
  block:
    # The NONINTERACTIVE installer never prompts for a password; it requires
    # that its internal `sudo` calls (to create/chown the prefix) succeed
    # without a TTY. Grant temporary passwordless sudo for the install user
    # so the installer can chown /opt/homebrew (or /usr/local), then remove
    # it. The installer itself must NOT run under become (it refuses root).
    - name: Grant temporary passwordless sudo for the Homebrew install user
      ansible.builtin.copy:
        dest: /etc/sudoers.d/homebrew-install
        content: "{{ ansible_facts['user_id'] }} ALL=(ALL) NOPASSWD: ALL\n"
        mode: "0440"
        validate: "visudo -cf %s"
      become: true

    - name: Run the official Homebrew installer (NONINTERACTIVE)
      ansible.builtin.shell: |
        NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      args:
        stdin: /dev/null
      register: homebrew_install
      changed_when: true
  always:
    - name: Remove the temporary passwordless sudo drop-in
      ansible.builtin.file:
        path: /etc/sudoers.d/homebrew-install
        state: absent
      become: true
  tags: [packages, brew, cask, darwin]

- name: Set Homebrew prefix
  ansible.builtin.set_fact:
    homebrew_prefix: "{{ '/opt/homebrew' if ansible_architecture == 'arm64' else '/usr/local' }}"
  tags: [packages, brew, cask, darwin]

- name: Ensure Homebrew is in PATH
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.zprofile"
    line: 'eval "$({{ homebrew_prefix }}/bin/brew shellenv)"'
    create: true
    mode: "0644"
  tags: [packages, brew, cask, darwin]

- name: Update Homebrew
  community.general.homebrew:
    update_homebrew: true
  when: packages_brew_update | bool
  tags: [packages, brew, cask, darwin]

- name: Tap Homebrew repositories
  community.general.homebrew_tap:
    name: "{{ provider_taps | unique | sort }}"
    state: present
  when: (provider_taps | default([])) | length > 0
  tags: [packages, brew, cask, darwin]

- name: Install Homebrew formulae
  community.general.homebrew:
    name: "{{ provider_packages | unique | sort }}"
    state: present
  when: provider_packages | length > 0
  tags: [packages, brew, cask, darwin]

- name: Install Homebrew casks
  community.general.homebrew_cask:
    name: "{{ provider_casks | unique | sort }}"
    state: present
  when: provider_casks | length > 0
  tags: [packages, brew, cask, darwin]

- name: Clean up Homebrew cache
  ansible.builtin.command:
    cmd: "{{ homebrew_prefix }}/bin/brew cleanup --prune=7"
  register: brew_cleanup
  changed_when: (brew_cleanup.stdout | default('')) | length > 0
  when: not ansible_check_mode
  tags: [packages, brew, cask, darwin]

- name: Scrub Homebrew cache, including downloads for installed formulae
  ansible.builtin.command:
    cmd: "{{ homebrew_prefix }}/bin/brew cleanup -s"
  changed_when: true
  when: not ansible_check_mode
  tags: [packages, brew, cask, darwin]
