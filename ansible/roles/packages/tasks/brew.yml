---
# Install Homebrew formulae and casks on macOS hosts (one Brewfile).
#
# Input:
#   provider_packages (list[str]) — formulae
#   provider_casks    (list[str]) — casks
#   provider_taps     (list[str]) — user/repo taps for either
#
# Missing brew is installed with the official script (arm64 → /opt/homebrew,
# Intel → /usr/local). The installer uses NONINTERACTIVE sudo (sudo -n).

- name: Assert Homebrew package lists are lists
  ansible.builtin.assert:
    that:
      - provider_packages is defined
      - provider_packages is sequence
      - provider_casks is defined
      - provider_casks is sequence
    fail_msg: "packages/brew: provider_packages and provider_casks must be lists."
    quiet: true
  tags: [packages, brew, cask, darwin]

- name: Assert the host is Darwin
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Darwin'
    fail_msg: >-
      packages/brew requires a macOS host.
      Detected os_family={{ ansible_facts['os_family'] }}.
    quiet: true
  tags: [packages, brew, cask, darwin]

- name: Resolve brew binary
  ansible.builtin.set_fact:
    packages_brew_bin: >-
      {{
        packages_brew_path
        if packages_brew_path | default('') | length > 0
        else (
          '/opt/homebrew/bin/brew'
          if ansible_facts['architecture'] in ['arm64', 'aarch64']
          else '/usr/local/bin/brew'
        )
      }}
  tags: [packages, brew, cask, darwin]

- name: Stat brew
  ansible.builtin.stat:
    path: "{{ packages_brew_bin }}"
  register: packages_brew_stat
  tags: [packages, brew, cask, darwin]

- name: Run the official Homebrew installer
  ansible.builtin.shell:
    cmd: NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  environment:
    NONINTERACTIVE: "1"
    CI: "1"
  when:
    - not packages_brew_stat.stat.exists | default(false)
    - not ansible_check_mode
  tags: [packages, brew, cask, darwin]

- name: Re-stat brew after bootstrap
  ansible.builtin.stat:
    path: "{{ packages_brew_bin }}"
  register: packages_brew_stat
  when: not packages_brew_stat.stat.exists | default(false)
  tags: [packages, brew, cask, darwin]

- name: Fail if Homebrew is still missing
  ansible.builtin.fail:
    msg: >-
      Homebrew is not installed at {{ packages_brew_bin }}.
      The official installer needs passwordless sudo (`sudo -n`).
      Or run it in Terminal as an Administrator:
      /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  when:
    - not packages_brew_stat.stat.exists | default(false)
    - not ansible_check_mode
    - (provider_packages | length > 0) or (provider_casks | length > 0)
  tags: [packages, brew, cask, darwin]

- name: Remember brew environment for later tasks
  ansible.builtin.set_fact:
    packages_brew_stream_env:
      PATH: "{{ packages_brew_bin | dirname }}:{{ ansible_facts['env']['PATH'] }}"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_EMOJI: "1"
      NONINTERACTIVE: "1"
      CI: "1"
      GIT_TERMINAL_PROMPT: "0"
  when: packages_brew_stat.stat.exists | default(false)
  tags: [packages, brew, cask, darwin]

- name: Ensure Brewfile directory exists
  ansible.builtin.file:
    path: "{{ packages_brewfile | dirname }}"
    state: directory
    mode: "0700"
  when: packages_brew_stat.stat.exists | default(false)
  tags: [packages, brew, cask, darwin]

- name: Write Brewfile
  ansible.builtin.copy:
    dest: "{{ packages_brewfile }}"
    mode: "0644"
    content: |
      {% for tap in provider_taps | default([]) | unique | sort %}
      tap {{ tap | to_json }}
      {% endfor %}
      {% for pkg in provider_packages | unique | sort %}
      brew {{ pkg | to_json }}
      {% endfor %}
      {% for pkg in provider_casks | unique | sort %}
      cask {{ pkg | to_json }}
      {% endfor %}
  when:
    - (provider_packages | length > 0) or (provider_casks | length > 0)
    - packages_brew_stat.stat.exists | default(false)
  tags: [packages, brew, cask, darwin]

- name: Update Homebrew
  ansible.builtin.command:
    argv:
      - brew
      - update
  environment: "{{ packages_brew_stream_env }}"
  when:
    - not ansible_check_mode
    - packages_brew_update | bool
    - packages_brew_stat.stat.exists | default(false)
  tags: [packages, brew, cask, darwin]

- name: Install Homebrew formulae and casks
  ansible.builtin.command:
    argv:
      - brew
      - bundle
      - install
      - --file
      - "{{ packages_brewfile }}"
      - --no-upgrade
      - --jobs
      - "{{ packages_brew_jobs }}"
  environment: "{{ packages_brew_stream_env }}"
  register: packages_brew_bundle
  changed_when: >-
    'Installing ' in (packages_brew_bundle.stdout | default(''))
    or '==> ' in (packages_brew_bundle.stdout | default(''))
  when:
    - not ansible_check_mode
    - (provider_packages | length > 0) or (provider_casks | length > 0)
    - packages_brew_stat.stat.exists | default(false)
  tags: [packages, brew, cask, darwin]
