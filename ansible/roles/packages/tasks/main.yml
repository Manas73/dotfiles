---
# packages role: cross-OS package installation.
#
# Intent     -> <group>_apps lists + profile_apps in group_vars
# Catalog    -> group_vars/all/package_catalog.yml
# Resolve    -> this role (resolve_catalog filter)
# Providers  -> tasks/{pacman,aur,brew,cask}.yml
#
# Does NOT manage configuration, services, or dotfiles.

- name: Compute target OS from ansible_facts
  ansible.builtin.set_fact:
    packages_target_os: >-
      {%- if ansible_facts['os_family'] == 'Archlinux' -%}arch
      {%- elif ansible_facts['os_family'] == 'Darwin' -%}darwin
      {%- else -%}unknown
      {%- endif -%}
  tags: [packages]

- name: Compute default provider for target OS
  ansible.builtin.set_fact:
    packages_default_provider: >-
      {%- if packages_target_os == 'arch' -%}pacman
      {%- elif packages_target_os == 'darwin' -%}brew
      {%- else -%}unknown
      {%- endif -%}
  tags: [packages]

- name: Assert target OS is supported
  ansible.builtin.assert:
    that:
      - packages_target_os in ['arch', 'darwin']
      - packages_default_provider in ['pacman', 'brew']
    fail_msg: >-
      packages role does not support os_family
      {{ ansible_facts['os_family'] | default('<unknown>') }}.
      Supported: Archlinux (provider pacman), Darwin (provider brew).
    quiet: true
  tags: [packages]

- name: Aggregate logical app names from this host's OS group and profiles
  ansible.builtin.set_fact:
    # OS-family <group>_apps lists are included only when the host is
    # actually in that inventory group (defensive guard).
    #
    # Profile apps are pulled from group_vars/all/profiles.yml via the
    # host_vars `profiles:` list. extract() with default [] silently skips
    # unknown profile names.
    packages_logical_apps: >-
      {{
        (arch_apps   | default([]) if 'arch'   in group_names else [])
        + (darwin_apps | default([]) if 'darwin' in group_names else [])
        + ((profiles | default([])) | map('extract', profile_apps | default({}), []) | flatten)
      }}
  tags: [packages]

- name: Resolve logical names through the package catalog
  ansible.builtin.set_fact:
    packages_resolved: >-
      {{
        packages_logical_apps
        | resolve_catalog(
            package_catalog | default({}),
            packages_target_os,
            packages_default_provider
          )
      }}
  tags: [packages]

- name: Show resolved per-provider package buckets
  ansible.builtin.debug:
    msg: "{{ packages_resolved }}"
    verbosity: 1
  tags: [packages]

# Fixed order: pacman before aur (shared DB refresh), brew before cask
# (Homebrew bootstrap). Only non-empty buckets are included.

- name: Install pacman packages
  ansible.builtin.include_tasks:
    file: pacman.yml
    apply:
      tags: [packages, pacman, arch]
  vars:
    provider_packages: "{{ packages_resolved.pacman | default([]) }}"
  when: (packages_resolved.pacman | default([])) | length > 0
  tags: [packages, pacman, arch]

- name: Install AUR packages
  ansible.builtin.include_tasks:
    file: aur.yml
    apply:
      tags: [packages, aur, arch]
  vars:
    provider_packages: "{{ packages_resolved.aur | default([]) }}"
  when: (packages_resolved.aur | default([])) | length > 0
  tags: [packages, aur, arch]

- name: Install Homebrew formulae
  ansible.builtin.include_tasks:
    file: brew.yml
    apply:
      tags: [packages, brew, darwin]
  vars:
    provider_packages: "{{ packages_resolved.brew | default([]) }}"
  when: (packages_resolved.brew | default([])) | length > 0
  tags: [packages, brew, darwin]

- name: Install Homebrew casks
  ansible.builtin.include_tasks:
    file: cask.yml
    apply:
      tags: [packages, cask, darwin]
  vars:
    provider_packages: "{{ packages_resolved.cask | default([]) }}"
  when: (packages_resolved.cask | default([])) | length > 0
  tags: [packages, cask, darwin]
