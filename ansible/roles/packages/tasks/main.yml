---
# packages role: cross-OS package installation.
#
# Intent     -> os_apps (group_vars/<os>/apps.yml) + profile_apps via recipe
# Catalog    -> group_vars/all/package_catalog.yml
# Resolve    -> this role (resolve_catalog filter)
# Providers  -> tasks/{pacman,aur,brew}.yml
# Homebrew formulae and casks share brew.yml (one Brewfile / brew bundle).
#
# Does NOT manage configuration, services, or dotfiles.
# Recipe must be loaded first (playbooks/tasks/load_recipe.yml) so
# `profiles` is available.

- name: Resolve target OS and default provider from facts
  ansible.builtin.set_fact:
    packages_target_os: >-
      {{
        (os_family_map | default({}))
          [ansible_facts['os_family']]
          .target_os
        | default('unknown')
      }}
    packages_default_provider: >-
      {{
        (os_family_map | default({}))
          [ansible_facts['os_family']]
          .default_provider
        | default('unknown')
      }}
  tags: [packages]

- name: Assert target OS is supported
  ansible.builtin.assert:
    that:
      - packages_target_os != 'unknown'
      - packages_default_provider != 'unknown'
    fail_msg: >-
      packages role does not support os_family
      {{ ansible_facts['os_family'] | default('<unknown>') }}.
      Add a row to group_vars/all/os_providers.yml and group_vars/<os>/.
      Known: {{ os_family_map | default({}) | to_json }}.
    quiet: true
  tags: [packages]

- name: Aggregate logical app names from os_apps, recipe profiles, and recipe apps
  ansible.builtin.set_fact:
    # os_apps: OS group_vars (same var name on every OS).
    # profiles → profile_apps: shared bundles from the recipe's profiles: list.
    # apps: recipe-local extras (e.g. slack on mac_turing only).
    # extract() with default [] silently skips unknown profile names.
    packages_logical_apps: >-
      {{
        (os_apps | default([]))
        + ((profiles | default([])) | map('extract', profile_apps | default({}), []) | flatten)
        + (apps | default([]))
      }}
  tags: [packages]

- name: Resolve logical names through the package catalog
  ansible.builtin.set_fact:
    packages_resolved: >-
      {{
        packages_logical_apps
        | resolve_catalog(
            package_catalog | default({}),
            packages_target_os,
            packages_default_provider
          )
      }}
  tags: [packages]

- name: Show resolved per-provider package buckets
  ansible.builtin.debug:
    msg: "{{ packages_resolved }}"
    verbosity: 1
  tags: [packages]

# Fixed order: pacman before aur (shared DB refresh), then Homebrew
# (formulae + casks in one Brewfile). Only non-empty buckets are included.
# Skip installs when packages_validate_only (unprivileged mise run check).

- name: Install pacman packages
  ansible.builtin.include_tasks:
    file: pacman.yml
    apply:
      tags: [packages, pacman, arch]
  vars:
    provider_packages: "{{ packages_resolved.packages.pacman | default([]) }}"
  when:
    - not (packages_validate_only | default(false) | bool)
    - (packages_resolved.packages.pacman | default([])) | length > 0
  tags: [packages, pacman, arch]

- name: Install AUR packages
  ansible.builtin.include_tasks:
    file: aur.yml
    apply:
      tags: [packages, aur, arch]
  vars:
    provider_packages: "{{ packages_resolved.packages.aur | default([]) }}"
  when:
    - not (packages_validate_only | default(false) | bool)
    - (packages_resolved.packages.aur | default([])) | length > 0
  tags: [packages, aur, arch]

- name: Install Homebrew formulae and casks
  ansible.builtin.include_tasks:
    file: brew.yml
    apply:
      tags: [packages, brew, cask, darwin]
  vars:
    provider_packages: "{{ packages_resolved.packages.brew | default([]) }}"
    provider_casks: "{{ packages_resolved.packages.cask | default([]) }}"
    provider_taps: >-
      {{
        (
          (packages_resolved.taps.brew | default([]))
          + (packages_resolved.taps.cask | default([]))
        ) | unique | sort
      }}
  when:
    - not (packages_validate_only | default(false) | bool)
    - (
        (packages_resolved.packages.brew | default([])) | length > 0
        or (packages_resolved.packages.cask | default([])) | length > 0
      )
  tags: [packages, brew, cask, darwin]

- name: Report resolved packages (validate-only)
  ansible.builtin.debug:
    msg: >-
      packages_validate_only: resolved
      {{ packages_logical_apps | length }} logical apps →
      {{ (packages_resolved.packages | default({})) | dict2items
         | map(attribute='key')
         | list
         | join(', ') }}
      (no installs)
  when: packages_validate_only | default(false) | bool
  tags: [packages]
