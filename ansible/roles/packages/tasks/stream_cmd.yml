---
# Run a long install command without looking stuck.
#
# Child stdout/stderr go to packages_live_log via a PTY (files/pty_run.py)
# so line-buffered tools actually emit while they run. The live_log
# callback tails that file on each async poll (last N lines of each burst).
#
# Required vars:
#   stream_title — task name / banner
#   stream_shell — bash command body (callers must quote arguments)
# Optional:
#   stream_environment — extra env (PATH, MISE_YES, …)
#   stream_changed_regex — ERE; last N log lines matching => changed
#   stream_become — run with become
#   stream_chdir — working directory

- name: "Announce {{ stream_title }}"
  ansible.builtin.debug:
    msg: >-
      {{ stream_title }}.
      Live log: {{ packages_live_log }}
      (last {{ packages_install_log_lines }} lines every {{ packages_install_poll }}s).

- name: Ensure the live log directory exists
  ansible.builtin.file:
    path: "{{ packages_live_log | dirname }}"
    state: directory
    mode: "0700"

- name: Ensure the live log is user-writable (root and user both append)
  ansible.builtin.file:
    path: "{{ packages_live_log }}"
    state: touch
    mode: "0644"
    modification_time: preserve
    access_time: preserve

- name: "{{ stream_title }}"
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/files/pty_run.py"
      - "{{ packages_live_log }}"
      - "{{ stream_title }}"
      - "{{ stream_shell }}"
      - "{{ stream_changed_regex | default('install|pouring|fetch|download|build|upgrad') }}"
      - "{{ packages_install_log_lines }}"
    chdir: "{{ stream_chdir | default(omit) }}"
  become: "{{ stream_become | default(false) | bool }}"
  async: "{{ packages_install_async_timeout }}"
  poll: "{{ packages_install_poll }}"
  register: stream_result
  environment: "{{ stream_environment | default(omit) }}"
  changed_when: "'STREAM_CHANGED' in (stream_result.stdout | default(''))"
