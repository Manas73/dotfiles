---
# Install pacman packages on Arch/Garuda hosts.
#
# Input: provider_packages (list[str]) — concrete pacman package names.
# Multilib is a pacman repo, not a separate manager; steam and friends
# install here the same way (multilib must be enabled in /etc/pacman.conf).

- name: Assert provider_packages is defined and a list
  ansible.builtin.assert:
    that:
      - provider_packages is defined
      - provider_packages is sequence
    fail_msg: "packages/pacman: provider_packages must be a list."
    quiet: true
  tags: [packages, pacman, arch]

- name: Assert the host is Arch-based
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Archlinux'
    fail_msg: >-
      packages/pacman requires an Arch-based host (Arch, Garuda, Manjaro).
      Detected os_family={{ ansible_facts['os_family'] }}.
    quiet: true
  tags: [packages, pacman, arch]

- name: Verify pacman is available
  ansible.builtin.shell: command -v pacman
  register: packages_pacman_binary
  changed_when: false
  failed_when: packages_pacman_binary.rc != 0
  check_mode: false
  tags: [packages, pacman, arch]

- name: Perform a full system upgrade (pacman -Syu)
  community.general.pacman:
    update_cache: true
    upgrade: true
  become: true
  when: packages_pacman_perform_upgrade | bool
  tags: [packages, pacman, arch, upgrade]

- name: Refresh pacman databases (pacman -Sy)
  community.general.pacman:
    update_cache: true
  become: true
  when:
    - packages_pacman_refresh_databases | bool
    - not (packages_pacman_perform_upgrade | bool)
  tags: [packages, pacman, arch]

- name: Install pacman packages (-S --needed)
  community.general.pacman:
    name: "{{ provider_packages | unique | sort }}"
    state: present
  become: true
  when: provider_packages | length > 0
  tags: [packages, pacman, arch]
