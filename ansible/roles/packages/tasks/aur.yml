---
# Install AUR packages via kewlfft.aur.aur on Arch/Garuda hosts.
#
# Input: provider_packages (list[str]) — concrete AUR package names.
# If yay is missing, installs yay-bin with use=makepkg, then installs the
# rest with use=yay. extra_args add --useask so package conflicts do not
# fail unattended (the module already passes --noconfirm --needed).
# Check mode is supported by the module (pacman -T).
# No become: yay/makepkg refuse root; sudoers grants NOPASSWD pacman so
# the helper can install repo deps.

- name: Assert provider_packages is defined and a list
  ansible.builtin.assert:
    that:
      - provider_packages is defined
      - provider_packages is sequence
    fail_msg: "packages/aur: provider_packages must be a list."
    quiet: true
  tags: [packages, aur, arch]

- name: Assert the host is Arch-based
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Archlinux'
    fail_msg: >-
      packages/aur requires an Arch-based host (Arch, Garuda, Manjaro).
    quiet: true
  tags: [packages, aur, arch]

- name: Assert makepkg is available
  ansible.builtin.shell: command -v makepkg
  register: packages_aur_makepkg_binary
  changed_when: false
  failed_when: packages_aur_makepkg_binary.rc != 0
  check_mode: false
  tags: [packages, aur, arch]

- name: Detect yay
  ansible.builtin.shell: command -v yay
  register: packages_aur_yay_binary
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [packages, aur, arch]

- name: Ensure git and base-devel are present to bootstrap yay
  community.general.pacman:
    name:
      - git
      - base-devel
    state: present
  become: true
  when:
    - packages_aur_yay_binary.rc != 0
    - provider_packages | length > 0
  tags: [packages, aur, arch]

- name: Bootstrap yay-bin via makepkg
  kewlfft.aur.aur:
    name: yay-bin
    use: makepkg
    state: present
  when:
    - packages_aur_yay_binary.rc != 0
    - provider_packages | length > 0
  tags: [packages, aur, arch]

- name: Install AUR packages
  kewlfft.aur.aur:
    name: "{{ provider_packages | unique | sort }}"
    use: yay
    state: present
    update_cache: "{{ packages_aur_refresh_databases | bool }}"
    extra_args: "{{ packages_aur_yay_extra_args }}"
  when: provider_packages | length > 0
  tags: [packages, aur, arch]
