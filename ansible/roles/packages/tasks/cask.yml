---
# Install Homebrew casks (GUI apps) on macOS hosts.
#
# Input: provider_packages (list[str]) — concrete cask names.
# Assumes Homebrew is already installed (brew.yml bootstraps it when
# formulae are present). If you only install casks, ensure brew is present
# first or list at least one formula so brew.yml runs.

- name: Assert provider_packages is defined and a list
  ansible.builtin.assert:
    that:
      - provider_packages is defined
      - provider_packages is sequence
    fail_msg: "packages/cask: provider_packages must be a list."
    quiet: true
  tags: [packages, cask, darwin]

- name: Assert the host is Darwin
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Darwin'
    fail_msg: >-
      packages/cask requires a macOS host.
      Detected os_family={{ ansible_facts['os_family'] }}.
    quiet: true
  tags: [packages, cask, darwin]

- name: Fail if Homebrew is missing
  ansible.builtin.fail:
    msg: >-
      packages/cask requires Homebrew (packages_brew_resolved) but it is
      unset. List at least one formula so brew.yml bootstraps first, or
      install brew from https://brew.sh.
  when:
    - (packages_brew_resolved | default('')) | length == 0
    - not ansible_check_mode
    - provider_packages | length > 0
  tags: [packages, cask, darwin]

- name: Tap required Homebrew repositories
  community.general.homebrew_tap:
    name: "{{ provider_taps }}"
    state: present
    path: "{{ packages_brew_bin_dir }}"
  when:
    - (provider_taps | default([])) | length > 0
    - (packages_brew_resolved | default('')) | length > 0
  environment:
    PATH: "{{ packages_brew_bin_dir }}:{{ ansible_facts['env']['PATH'] }}"
  tags: [packages, cask, darwin]

- name: Install Homebrew casks
  community.general.homebrew_cask:
    name: "{{ provider_packages | unique | sort }}"
    state: present
    path: "{{ packages_brew_bin_dir }}"
  when:
    - provider_packages | length > 0
    - (packages_brew_resolved | default('')) | length > 0
  environment:
    PATH: "{{ packages_brew_bin_dir }}:{{ ansible_facts['env']['PATH'] }}"
  tags: [packages, cask, darwin]
