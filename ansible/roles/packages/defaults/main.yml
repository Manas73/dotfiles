---
# Defaults for the packages role (provider task files).

# When true, resolve intent through the catalog but skip all provider
# installs (no become). Used by playbooks/validate.yml for passwordless
# mise run check.
packages_validate_only: false

# --- pacman ---
# Refresh package databases before installing (pacman -Sy).
packages_pacman_refresh_databases: true

# Full system upgrade (pacman -Syu) before install. Off by default;
# partial upgrades on Arch are unsafe. Pass -e packages_pacman_perform_upgrade=true
# when a full upgrade is intentional.
packages_pacman_perform_upgrade: false

# --- AUR / yay ---
packages_aur_bootstrap_dir: "/tmp/yay-bin-bootstrap"
packages_aur_refresh_databases: true

# --- Homebrew ---
# Preferred brew binary. Empty = arch default (/opt/homebrew/bin/brew
# on arm64, /usr/local/bin/brew on Intel). brew.yml also probes the
# user prefix and PATH.
packages_brew_path: ""
packages_brew_update: true
# brew bundle --jobs. `auto` = CPU cores, max 4. Override with 1/4/8.
packages_brew_jobs: auto
packages_brewfile: "{{ ansible_facts['user_dir'] }}/.cache/dotfiles/Brewfile"
# Used when the login user is not a macOS Administrator (typical work
# laptop). Official /opt/homebrew install requires sudo. Empty =
# {{ ansible_facts.user_dir }}/.local/homebrew.
packages_brew_user_prefix: ""
