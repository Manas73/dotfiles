---
# Defaults for the packages role (provider task files).

# When true, resolve intent through the catalog but skip all provider
# installs (no become). Used by playbooks/validate.yml for passwordless
# mise run check.
packages_validate_only: false

# Long mise installs write here. The live_log callback tails this file
# and prints each new line as it arrives. Override the path with
# ANSIBLE_PACKAGES_LIVE_LOG. packages_install_log_lines is only the
# failure-dump tail from pty_run.
packages_live_log: "{{ ansible_facts['user_dir'] }}/.cache/dotfiles/ansible-packages.log"
packages_install_log_lines: 20

# --- pacman ---
# Refresh package databases before installing (pacman -Sy).
packages_pacman_refresh_databases: true

# Full system upgrade (pacman -Syu) before install. Off by default;
# partial upgrades on Arch are unsafe. Pass -e packages_pacman_perform_upgrade=true
# when a full upgrade is intentional.
packages_pacman_perform_upgrade: false

# --- AUR (kewlfft.aur.aur) ---
# Refresh the package cache (`yay -Sy`) before install.
packages_aur_refresh_databases: true

# Extra yay flags. The module already passes --noconfirm --needed
# --cleanafter. --noconfirm alone answers No to package conflicts;
# --useask maps that to Yes. --answerdiff/--answerclean None skip
# yay review menus. extra_args requires use=yay (not auto).
packages_aur_yay_extra_args: "--useask --removemake --answerdiff None --answerclean None"

# --- Homebrew ---
# Preferred brew binary. Empty = probe /opt/homebrew then /usr/local.
# Missing brew is installed with the official NONINTERACTIVE script.
packages_brew_path: ""
packages_brew_update: true
