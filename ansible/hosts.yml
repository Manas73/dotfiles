---
# Personal inventory.
#
# Two orthogonal axes, nested so each host is listed once:
#
#   OS family (linux → arch, darwin)
#     Shared OS package intent + OS-scoped plays.
#     Vars: group_vars/arch/, group_vars/darwin/
#
#   Machine class (nested under OS)
#     Shared host recipe: profiles, feature flags, plasma WM, class-level
#     chezmoi fields. Vars: group_vars/<class>/
#
# Hostname is inventory identity only (--limit $(hostname)).
# host_vars/<hostname>.yml holds true per-machine deltas (gpu, overrides).
#
# Package bundles (cli, hyprland, …) remain profile_apps in
# group_vars/all/profiles.yml — not inventory groups. Machine classes set
# which profiles they use via the `profiles:` list in group_vars/<class>/.
#
# group_vars directories are named after inventory groups (Ansible requirement).
# See group_vars/README.md for the hosts.yml ↔ group_vars map.
#
# Hierarchy:
#
#   all                          → group_vars/all/
#   ├── linux                    (play target; no group_vars)
#   │   └── arch                 → group_vars/arch/
#   │       └── workstation_personal  → group_vars/workstation_personal/
#   └── darwin                   → group_vars/darwin/
#       └── mac_work             → group_vars/mac_work/  (when onboarded)

all:
  children:
    linux:
      children:
        arch:
          children:
            workstation_personal:
              hosts:
                alfred:
                # desk2:

    darwin:
      # No Mac hosts yet. When onboarding, nest a machine class under darwin:
      #
      #   darwin:
      #     children:
      #       mac_work:
      #         hosts:
      #           <hostname>:
      #
      # Create host_vars/<hostname>.yml with at least `gpu: none` (and any
      # Intel brew path override). Recipe: group_vars/mac_work/.
      hosts: {}
