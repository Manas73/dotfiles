---
# Personal inventory.
#
# Two orthogonal axes:
#
#   1. OS family (linux → arch, darwin)
#      Shared OS package intent and OS-scoped plays live in
#      group_vars/{arch,darwin}.yml and playbook host patterns.
#
#   2. Machine class (workstation_personal, mac_work, …)
#      Shared host recipe: profiles, feature flags, plasma WM, class-level
#      chezmoi fields. Lives in group_vars/<class>.yml.
#
# Hostname is inventory *identity* only (targeting via --limit $(hostname)).
# host_vars/<hostname>.yml holds true per-machine deltas (user, GPU, email).
#
# Package *bundles* (cli, hyprland, …) are still profile_apps in
# group_vars/all/profiles.yml — not inventory groups. Machine classes declare
# which profiles a kind of machine opts into via the `profiles:` list.
#
# Hierarchy sketch:
#
#   all
#   ├── linux
#   │   └── arch              (OS)
#   ├── darwin                (OS)
#   ├── workstation_personal  (machine class)
#   └── mac_work              (machine class)
#
# A host is listed under both its OS group and its machine class.

all:
  children:
    # --- OS family ---
    linux:
      children:
        arch:
          hosts:
            alfred:

    darwin:
      # TODO: enable the Mac host after onboarding.
      #
      # Activation steps:
      #   1. Rename host_vars/mac-placeholder.yml to host_vars/<hostname>.yml
      #      and fill primary_user / email / gpu.
      #   2. Add the hostname under both `darwin` and `mac_work` below.
      #   3. Dry-run: ansible-playbook ... --limit <hostname> --check --tags packages
      hosts: {}

    # --- Machine classes (shared recipe via group_vars/<class>.yml) ---
    workstation_personal:
      hosts:
        alfred:
        # Add more identical personal Linux desktops/laptops here:
        # desk2:

    mac_work:
      # Members also listed under `darwin` above.
      hosts: {}
      #   <mac-hostname>:
