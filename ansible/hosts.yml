---
# Personal inventory.
#
# Two orthogonal axes, nested so each host is listed once:
#
#   OS family (linux → arch, darwin)
#     Shared OS package intent + OS-scoped plays:
#     group_vars/{arch,darwin}.yml, playbook host patterns.
#
#   Machine class (nested under OS)
#     Shared host recipe: profiles, feature flags, plasma WM, class-level
#     chezmoi fields. Lives in group_vars/<class>.yml.
#
# Hostname is inventory identity only (--limit $(hostname)).
# host_vars/<hostname>.yml holds true per-machine deltas (gpu, overrides).
#
# Package bundles (cli, hyprland, …) remain profile_apps in
# group_vars/all/profiles.yml — not inventory groups. Machine classes set
# which profiles they use via the `profiles:` list.
#
# Hierarchy:
#
#   all
#   ├── linux
#   │   └── arch
#   │       └── workstation_personal   ← hosts here
#   └── darwin
#       └── mac_work                   ← add when onboarding a Mac

all:
  children:
    linux:
      children:
        arch:
          children:
            workstation_personal:
              hosts:
                alfred:
                # desk2:

    darwin:
      # No Mac hosts yet. When onboarding, nest a machine class under darwin:
      #
      #   darwin:
      #     children:
      #       mac_work:
      #         hosts:
      #           <hostname>:
      #
      # Create host_vars/<hostname>.yml with at least `gpu: none` (and any
      # Intel brew path override). Recipe: group_vars/mac_work.yml.
      hosts: {}
