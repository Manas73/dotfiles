---
# Personal inventory — OS groups only.
#
# Each host sets:
#   recipe: <name>   → loads ansible/recipes/<name>.yml
#   gpu:    …        → chezmoi data (and any other true host deltas)
#
# OS package intent: group_vars/<os>/apps.yml (os_apps).
# Shared recipe:     recipes/<recipe>.yml (profiles, flags, email, …).
# Globals:           group_vars/all/
#
# linux is a parent for Linux-only plays (sudoers, kanata, plasma).
# See recipes/README.md and group_vars/README.md.

all:
  children:
    linux:
      children:
        arch:
          hosts:
            alfred:
              recipe: personal_workstation
              gpu: nvidia
            # desk2:
            #   recipe: personal_workstation
            #   gpu: amd

    darwin:
      hosts: {}
      # mbp:
      #   recipe: mac_work
      #   gpu: none
      #   # packages_brew_path: /usr/local/bin/brew   # Intel only
