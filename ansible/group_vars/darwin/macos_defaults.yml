---
# Shared macOS defaults for every Darwin host.
# Source of truth intent: archived nix-config hosts/darwin_system.nix
# system.defaults (+ CustomUserPreferences). Cross-check:
#   https://macos-defaults.com
#
# Recipe-specific keys: set macos_defaults_extra in recipes/<name>.yml.
# Dock persistent-apps omitted (brittle / personal layout); set per recipe
# if you want a fixed Dock.

macos_defaults:

  # --- NSGlobalDomain -------------------------------------------------
  - domain: NSGlobalDomain
    key: _HIHideMenuBar
    type: bool
    value: false

  - domain: NSGlobalDomain
    key: AppleInterfaceStyle
    type: string
    value: Dark

  - domain: NSGlobalDomain
    key: AppleInterfaceStyleSwitchesAutomatically
    type: bool
    value: false

  - domain: NSGlobalDomain
    key: AppleShowAllExtensions
    type: bool
    value: true

  - domain: NSGlobalDomain
    key: NSAutomaticCapitalizationEnabled
    type: bool
    value: false

  - domain: NSGlobalDomain
    key: NSAutomaticSpellingCorrectionEnabled
    type: bool
    value: false

  - domain: NSGlobalDomain
    key: com.apple.mouse.tapBehavior
    type: int
    value: 1

  - domain: NSGlobalDomain
    key: com.apple.trackpad.enableSecondaryClick
    type: bool
    value: true

  - domain: NSGlobalDomain
    key: AppleSpacesSwitchOnActivate
    type: bool
    value: true

  # --- Spaces ---------------------------------------------------------
  - domain: com.apple.spaces
    key: spans-displays
    type: bool
    value: true

  # --- Dock -----------------------------------------------------------
  - domain: com.apple.dock
    key: autohide
    type: bool
    value: true
    notify:
      - Restart Dock

  - domain: com.apple.dock
    key: magnification
    type: bool
    value: true
    notify:
      - Restart Dock

  - domain: com.apple.dock
    key: largesize
    type: int
    value: 95
    notify:
      - Restart Dock

  - domain: com.apple.dock
    key: mineffect
    type: string
    value: scale
    notify:
      - Restart Dock

  - domain: com.apple.dock
    key: orientation
    type: string
    value: right
    notify:
      - Restart Dock

  - domain: com.apple.dock
    key: showhidden
    type: bool
    value: false
    notify:
      - Restart Dock

  - domain: com.apple.dock
    key: show-recents
    type: bool
    value: false
    notify:
      - Restart Dock

  - domain: com.apple.dock
    key: tilesize
    type: int
    value: 52
    notify:
      - Restart Dock

  # --- Finder ---------------------------------------------------------
  - domain: com.apple.finder
    key: _FXShowPosixPathInTitle
    type: bool
    value: false
    notify:
      - Restart Finder

  - domain: com.apple.finder
    key: _FXSortFoldersFirst
    type: bool
    value: true
    notify:
      - Restart Finder

  - domain: com.apple.finder
    key: AppleShowAllExtensions
    type: bool
    value: true
    notify:
      - Restart Finder

  - domain: com.apple.finder
    key: AppleShowAllFiles
    type: bool
    value: false
    notify:
      - Restart Finder

  - domain: com.apple.finder
    key: CreateDesktop
    type: bool
    value: true
    notify:
      - Restart Finder

  - domain: com.apple.finder
    key: FXDefaultSearchScope
    type: string
    value: SCcf
    notify:
      - Restart Finder

  - domain: com.apple.finder
    key: FXEnableExtensionChangeWarning
    type: bool
    value: false
    notify:
      - Restart Finder

  - domain: com.apple.finder
    key: FXPreferredViewStyle
    type: string
    value: icnv
    notify:
      - Restart Finder

  - domain: com.apple.finder
    key: QuitMenuItem
    type: bool
    value: false
    notify:
      - Restart Finder

  - domain: com.apple.finder
    key: ShowPathbar
    type: bool
    value: true
    notify:
      - Restart Finder

  - domain: com.apple.finder
    key: ShowStatusBar
    type: bool
    value: false
    notify:
      - Restart Finder

  - domain: com.apple.finder
    key: NewWindowTarget
    type: string
    value: PfHm
    notify:
      - Restart Finder

  - domain: com.apple.finder
    key: FinderSpawnTab
    type: bool
    value: true
    notify:
      - Restart Finder

  # --- Trackpad -------------------------------------------------------
  - domain: com.apple.AppleMultitouchTrackpad
    key: Clicking
    type: bool
    value: true

  - domain: com.apple.AppleMultitouchTrackpad
    key: TrackpadRightClick
    type: bool
    value: true

  - domain: com.apple.driver.AppleBluetoothMultitouch.trackpad
    key: Clicking
    type: bool
    value: true

  - domain: com.apple.driver.AppleBluetoothMultitouch.trackpad
    key: TrackpadRightClick
    type: bool
    value: true

  # --- Desktop services / privacy / WindowManager ---------------------
  - domain: com.apple.desktopservices
    key: DSDontWriteNetworkStores
    type: bool
    value: true

  - domain: com.apple.desktopservices
    key: DSDontWriteUSBStores
    type: bool
    value: true

  - domain: com.apple.AdLib
    key: allowApplePersonalizedAdvertising
    type: bool
    value: false

  - domain: com.apple.WindowManager
    key: EnableStandardClickToShowDesktop
    type: bool
    value: false

  # Battery percentage in menu bar (ByHost / currentHost).
  - domain: com.apple.controlcenter
    host: currentHost
    key: BatteryShowPercentage
    type: bool
    value: true
    notify:
      - Restart SystemUIServer
