---
# macOS package intent (logical names).
#
# Variable name is always `os_apps` (same on every OS group). Resolved by
# roles/packages against group_vars/all/package_catalog.yml, then
# dispatched to brew or cask. Names not in the catalog fall through to
# brew with the same name verbatim.
#
# Scope: macOS-specific apps only. Cross-platform CLI tools live in the
# `cli` profile; recipes opt in via `profiles:`.

os_apps:
  # ----------------------------------------------------------------
  # Cross-OS GUI apps via catalog (route to cask).
  # ----------------------------------------------------------------
  - bazecor
  - docker
  - ghostty
  - google-chrome
  - kanata
  - vivaldi
  - vlc

  # ----------------------------------------------------------------
  # macOS-only GUI apps via cask (add as Mac onboarding progresses).
  # Examples: iterm2, rectangle, karabiner-elements, alt-tab
  # ----------------------------------------------------------------
