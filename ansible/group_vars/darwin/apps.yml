---
# macOS package intent (logical names).
#
# Resolved by roles/packages against group_vars/all/package_catalog.yml,
# then dispatched to brew or cask. Names not in the catalog fall through
# to brew with the same name verbatim.
#
# Scope: macOS-specific apps only. Cross-platform CLI tools live in the
# `cli` profile (group_vars/all/profiles.yml); machine classes opt in via
# `profiles:` in their main.yml.

darwin_apps:
  # ----------------------------------------------------------------
  # Cross-OS GUI apps via catalog (route to cask).
  # ----------------------------------------------------------------
  - "1password"
  - dropbox
  - firefox
  - google-chrome
  - slack
  - vivaldi
  - vlc
  - vuescan
  - zoom

  # ----------------------------------------------------------------
  # Cross-OS bundles via catalog.
  # ----------------------------------------------------------------
  - docker             # bundle -> docker-engine + buildx + compose (brew)

  # ----------------------------------------------------------------
  # macOS-only GUI apps via cask (add as Mac onboarding progresses).
  # Examples: iterm2, rectangle, karabiner-elements, alt-tab
  # ----------------------------------------------------------------
