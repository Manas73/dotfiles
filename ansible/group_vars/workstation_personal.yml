---
# Machine class: personal Linux workstation (Arch/Garuda).
#
# Nested under linux → arch in hosts.yml. Shared recipe for every member.
# Per-machine deltas (gpu, rare overrides) stay in host_vars/<hostname>.yml.
#
# Package bundles resolve via profile_apps in group_vars/all/profiles.yml.
# osid comes from group_vars/arch.yml; primary_user defaults in all/main.yml.

# Chezmoi data (unprefixed; chezmoi.toml.j2 reads these directly).
profile: "personal"
email: "manas.sambare@gmail.com"

# Plasma custom window manager. Consumed by the plasma_custom_wm role.
# Set to "kwin" or omit to disable masking and use stock KWin.
plasma_window_manager: "i3"

# Profile membership. Each name resolves against profile_apps.
profiles:
  - cli
  - cloud
  - development
  - fonts
  - gaming
  - hyprland
  - i3
  - kde
  - virtualization

# Feature flags (override all/main.yml defaults).
docker_enabled: true
kanata_enabled: true
libvirt_enabled: true
