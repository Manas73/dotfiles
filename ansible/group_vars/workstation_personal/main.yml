---
# Machine class: personal Linux workstation.
# Inventory: linux → arch → workstation_personal (hosts.yml).
#
# Per-machine deltas (gpu, rare overrides): host_vars/<hostname>.yml.
# osid: arch/main.yml. primary_user default: all/main.yml.
# Package bundles: all/profiles.yml via `profiles:` below.

# Chezmoi data (unprefixed; chezmoi.toml.j2 reads these directly).
profile: "personal"
email: "manas.sambare@gmail.com"

# Plasma custom window manager. Consumed by the plasma_custom_wm role.
# Set to "kwin" or omit to disable masking and use stock KWin.
plasma_window_manager: "i3"

# Profile membership. Each name resolves against profile_apps.
profiles:
  - cli
  - cloud
  - development
  - fonts
  - gaming
  - hyprland
  - i3
  - kde
  - virtualization

# Feature flags (override all/main.yml defaults).
docker_enabled: true
kanata_enabled: true
libvirt_enabled: true
