---
# Machine class: work Mac.
#
# Shared recipe for every host in the `mac_work` inventory group.
# Per-machine deltas (primary_user, email, gpu, Intel brew path) stay in
# host_vars/<hostname>.yml.
#
# Package bundles resolve via profile_apps in group_vars/all/profiles.yml.
# Linux-only profiles (kde, fonts, gaming, hyprland, i3) are intentionally
# omitted.

# Chezmoi data fields (unprefixed; chezmoi.toml.j2 reads these directly).
profile: "work"
osid: "darwin"

# Profile membership. cli is the cross-platform baseline; cloud and
# development add AWS/GCP and IDEs/tools.
profiles:
  - cli
  - cloud
  - development

# Feature flags. macOS defaults; override per host if needed.
docker_enabled: false   # Docker Desktop on Mac is a separate install
kanata_enabled: false   # Kanata on macOS needs different setup; defer
