---
# Machine class: work Mac.
#
# Nest under darwin in hosts.yml when onboarding:
#
#   darwin:
#     children:
#       mac_work:
#         hosts:
#           <hostname>:
#
# Per-machine deltas (gpu, Intel brew path) stay in host_vars/<hostname>.yml.
# osid comes from group_vars/darwin.yml; primary_user defaults in all/main.yml.
# Feature flags inherit false defaults from group_vars/all/main.yml.
#
# Package bundles resolve via profile_apps. Linux-only profiles are omitted.

# Chezmoi data (unprefixed; chezmoi.toml.j2 reads these directly).
profile: "work"
email: "manas.sambare@gmail.com"

# Profile membership. cli is the cross-platform baseline; cloud and
# development add AWS/GCP and IDEs/tools.
profiles:
  - cli
  - cloud
  - development
