---
# Arch/Garuda package intent (logical names).
#
# Variable name is always `os_apps` (same on every OS group). Resolved by
# roles/packages against group_vars/all/package_catalog.yml, then
# dispatched to pacman or aur. Names not in the catalog fall through to
# the default provider for arch (pacman).
#
# Scope: Arch-specific packages only. Cross-platform CLI tools and
# domain-grouped bundles live in group_vars/all/profiles.yml; recipes
# opt into those via `profiles:`.

os_apps:
  # ----------------------------------------------------------------
  # Cross-OS apps & bundles (catalog handles routing per OS).
  # ----------------------------------------------------------------
  - "1password"
  - bazecor
  - docker
  - dropbox
  - firefox
  - google-chrome
  - kanata
  - masterpdfeditor
  - naps2
  - rambox
  - slack
  - spotify
  - thunderbird
  - vivaldi
  - vlc
  - vuescan
  - zoom
  # ----------------------------------------------------------------
  # Arch-only
  # ----------------------------------------------------------------
  - alacritty
  - epson-inkjet-printer-escpr2
  - flameshot
  - gparted
  - headsetcontrol
  - kitty
  - libadwaita
  - libnotify
  - libreoffice-fresh
  - network-manager-applet
  - networkmanager
  - nm-connection-editor
  - nvtop
  - onlyoffice
  - pacseek
  - playerctl
  - psmisc
  - python-screeninfo
  - redshift
  - selectdefaultapplication
  - solaar
  - xdg-desktop-portal-gtk
