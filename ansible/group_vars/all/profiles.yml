---
# Profile intent catalog.
#
# Each profile groups its `apps` (packages) and optional `services` in one
# place. A host opts into a profile by listing its name in `profiles:` on
# its recipe (recipes/<name>.yml). The packages orchestrator unions
# `profiles_catalog[<name>].apps`; the services orchestrator unions
# `profiles_catalog[<name>].services`. Both resolve through their catalogs.
#
# Profiles are NOT inventory groups. Membership is declared once on the
# recipe, so removing a profile from a kind of machine is one edit.
# See recipes/README.md and group_vars/README.md.
#
# Layer 1 (intent) data; complements os_apps / os_services on each OS group.

