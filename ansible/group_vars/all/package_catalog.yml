---
# Logical app name -> install routing for the packages orchestrator.
# Every app referenced by os_apps / profiles_catalog[].apps MUST have an entry:
# the catalog is exhaustive, so there is no implicit fall-through to a default
# provider.
#
# Keys:
#   all:     cross-OS (typically provider: mise, packages: ["tool@version"])
#   arch:    Arch/Garuda (pacman / aur)
#   darwin:  macOS (brew / cask)
#
# `all:` is unioned with the matching OS key, so a CLI tool can be mise
# everywhere while still installing a system package on one OS (python).
# An app that is intentionally Linux-only omits `all:` and `darwin:`
# (and vice versa); the resolver silently skips it on the other OS.
# See ansible/README.md (Layer 2) for the schema.

