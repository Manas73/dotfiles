---
# Universal defaults for inventory group `all`.
# Sibling files: package_catalog.yml, profiles.yml (see group_vars/README.md).

# All personal hosts run ansible locally on themselves. Override in
# host_vars when ansible runs over SSH against a remote.
ansible_connection: local

# Default for local connection: the user running ansible (after gather_facts).
# Override in host_vars only when it differs (e.g. remote become target).
# Use ansible_facts form — INJECT_FACTS_AS_VARS is deprecated in 2.24+.
primary_user: "{{ ansible_facts['user_id'] }}"

# Chezmoi defaults. Host / class vars override per machine.
chezmoi_source_repo: "https://github.com/Manas73/dotfiles.git"
# chezmoi_repo_path is the git-clone root (contains .chezmoiroot, ansible/, docs/, chezmoi/).
chezmoi_repo_path: "{{ ansible_facts['user_dir'] }}/.local/share/chezmoi"
chezmoi_config_path: "{{ ansible_facts['user_dir'] }}/.config/chezmoi/chezmoi.toml"

# Feature enablement defaults. Host vars override.
docker_enabled: false
kanata_enabled: false
libvirt_enabled: false
