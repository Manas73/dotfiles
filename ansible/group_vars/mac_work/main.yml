---
# Machine class: work Mac.
# Inventory (when onboarded): darwin → mac_work (hosts.yml).
#
# Per-machine deltas (gpu, Intel brew path): host_vars/<hostname>.yml.
# osid: darwin/main.yml. primary_user default: all/main.yml.
# Feature flags inherit false defaults from all/main.yml.
# Package bundles: all/profiles.yml via `profiles:` below.

# Chezmoi data (unprefixed; chezmoi.toml.j2 reads these directly).
profile: "work"
email: "manas.sambare@gmail.com"

# Profile membership. cli is the cross-platform baseline; cloud and
# development add AWS/GCP and IDEs/tools. Linux-only profiles omitted.
profiles:
  - cli
  - cloud
  - development
