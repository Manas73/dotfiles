---
# macOS host placeholder. Rename this file to host_vars/<hostname>.yml and
# list that hostname under both `darwin` and `mac_work` in hosts.yml.
#
# Shared recipe (profiles, feature flags, profile/osid) lives in
# group_vars/mac_work.yml. This file is identity / hardware deltas only.
#
# Onboarding checklist:
#   1. Rename this file to match the inventory key in hosts.yml.
#   2. Set primary_user to your macOS username.
#   3. Confirm email / gpu below.
#   4. If on Intel Mac, set packages_brew_path: /usr/local/bin/brew.
#   5. Add the host under darwin + mac_work in hosts.yml.
#   6. Dry-run: ansible-playbook ... --limit <hostname> --check --tags packages
#   7. Optional: trim darwin_apps in group_vars/darwin.yml to taste.

# TODO: set this to your macOS username.
primary_user: TODO

# Chezmoi inventory data (host-specific).
email: "manas.sambare@gmail.com"
gpu: "none"

# Intel Mac only: override Homebrew location (Apple Silicon is the default).
