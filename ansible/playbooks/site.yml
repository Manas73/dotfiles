---
# Full machine provisioning.
#
# Order:
#   1. Sudoers drop-in for passwordless pacman (linux only).
#   2. Install OS packages so binaries exist.
#   3. Apply Chezmoi dotfiles so configs exist for the services below.
#   4. System wiring (fish login shell, docker, libvirt).
#   5. Specialty services (Kanata, Plasma custom WM).
#
# Packaging (intent → catalog → provider task files):
#   Intent       <group>_apps / profile_apps in group_vars
#   Catalog      group_vars/all/package_catalog.yml
#   packages     roles/packages (resolve + tasks/{pacman,aur,brew,cask}.yml)
#
# Run examples:
#   ansible-playbook -i hosts.yml playbooks/site.yml --limit alfred --ask-become-pass
#   ansible-playbook ... --tags packages           # all packages, any OS
#   ansible-playbook ... --tags aur                # arch AUR only
#   ansible-playbook ... --tags brew               # darwin brew only
#   ansible-playbook ... --tags dotfiles
#   ansible-playbook ... --tags system
#   ansible-playbook ... --tags fish
#   ansible-playbook ... --tags docker

- name: Install sudoers drop-ins required by other roles
  hosts: linux
  gather_facts: true
  tags: [system, sudoers]
  roles:
    - role: sudoers

- name: Install packages (cross-OS)
  hosts: all
  gather_facts: true
  tags: [packages]
  roles:
    - role: packages

- name: Render Chezmoi config and apply dotfiles
  hosts: all
  gather_facts: true
  tags: [dotfiles, chezmoi]
  roles:
    - role: chezmoi

- name: System wiring (shell, docker, libvirt)
  hosts: all
  gather_facts: true
  tags: [system]
  roles:
    - role: system

- name: Configure Kanata keyboard remapper
  hosts: linux
  gather_facts: true
  tags: [system, kanata]
  roles:
    - role: kanata
      when: kanata_enabled | default(false) | bool

- name: Configure Plasma with custom window manager
  hosts: linux
  gather_facts: true
  tags: [system, plasma]
  roles:
    - role: plasma_custom_wm
      when: plasma_window_manager is defined
