---
# Full machine provisioning.
#
# Order:
#   1. Sudoers drop-in for passwordless pacman (linux only).
#   2. Install OS packages so binaries exist.
#   3. Apply Chezmoi dotfiles so configs exist for the services below.
#   4. System wiring (fish login shell, docker, libvirt).
#   5. Specialty services (Kanata, Plasma custom WM).
#
# Each play loads recipes/<recipe>.yml first (see tasks/load_recipe.yml).
#
# Packaging:
#   Intent       os_apps + profile_apps (via recipe profiles:)
#   Catalog      group_vars/all/package_catalog.yml
#   packages     roles/packages
#
# Run examples:
#   ansible-playbook playbooks/site.yml --limit alfred --ask-become-pass
#   ansible-playbook ... --tags packages
#   ansible-playbook ... --tags dotfiles

- name: Install sudoers drop-ins required by other roles
  hosts: linux
  gather_facts: true
  tags: [system, sudoers]
  pre_tasks:
    - name: Load machine recipe
      ansible.builtin.import_tasks: tasks/load_recipe.yml
      tags: [always]
  roles:
    - role: sudoers

- name: Install packages (cross-OS)
  hosts: all
  gather_facts: true
  tags: [packages]
  pre_tasks:
    - name: Load machine recipe
      ansible.builtin.import_tasks: tasks/load_recipe.yml
      tags: [always]
  roles:
    - role: packages

- name: Render Chezmoi config and apply dotfiles
  hosts: all
  gather_facts: true
  tags: [dotfiles, chezmoi]
  pre_tasks:
    - name: Load machine recipe
      ansible.builtin.import_tasks: tasks/load_recipe.yml
      tags: [always]
  roles:
    - role: chezmoi

- name: System wiring (shell, docker, libvirt)
  hosts: all
  gather_facts: true
  tags: [system]
  pre_tasks:
    - name: Load machine recipe
      ansible.builtin.import_tasks: tasks/load_recipe.yml
      tags: [always]
  roles:
    - role: system

- name: Configure Kanata keyboard remapper
  hosts: linux
  gather_facts: true
  tags: [system, kanata]
  pre_tasks:
    - name: Load machine recipe
      ansible.builtin.import_tasks: tasks/load_recipe.yml
      tags: [always]
  roles:
    - role: kanata
      when: kanata_enabled | default(false) | bool

- name: Configure Plasma with custom window manager
  hosts: linux
  gather_facts: true
  tags: [system, plasma]
  pre_tasks:
    - name: Load machine recipe
      ansible.builtin.import_tasks: tasks/load_recipe.yml
      tags: [always]
  roles:
    - role: plasma_custom_wm
      when: plasma_window_manager is defined
